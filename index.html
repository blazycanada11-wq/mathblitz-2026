<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>MathBlitz • Event Control • 25 Clues</title>
<style>
:root{
 --ink:#171717;--paper:#f5efe0;--pink:#ed3b7a;--teal:#28bca8;--yellow:#f5c542;
 --purple:#887bd3;--blue:#4d8ee8;--white:#fff;--muted:#6b665c;--line:#d7cfbe;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{background-image:radial-gradient(#17171718 1px,transparent 1px);background-size:20px 20px}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{min-height:100vh;padding:18px}
.shell{max-width:1220px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:clamp(30px,6vw,54px);font-weight:1000;font-style:italic;line-height:.85;text-shadow:4px 4px 0 var(--yellow)}
.tag{font-size:10px;font-weight:900;letter-spacing:1.7px;margin-top:7px}
.pagebadge{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:8px 12px;font-weight:1000;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.nav a{text-decoration:none;text-align:center;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:11px 8px;font-size:12px;font-weight:1000;box-shadow:3px 3px 0 var(--ink)}
.nav a.active{background:var(--pink);color:#fff}
.nav a:nth-child(2).active{background:var(--teal);color:var(--ink)}
.nav a:nth-child(3).active{background:var(--yellow);color:var(--ink)}
.nav a:nth-child(4).active{background:var(--purple);color:#fff}
.nav a:nth-child(5).active{background:var(--blue);color:#fff}
.nav a:nth-child(6).active{background:var(--ink);color:#fff}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:6px 6px 0 var(--ink)}
.card + .card{margin-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}
.kicker{font-size:11px;font-weight:1000;letter-spacing:2px;color:var(--muted)}
.title{font-size:clamp(28px,5vw,48px);font-weight:1000;line-height:1;margin:7px 0 16px}
.bigquestion{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,5vw,64px);font-weight:1000;line-height:1.12;padding:20px}
.callmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:7px 11px;font-weight:1000;background:#e4faf5}
.btn{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:12px 15px;font-weight:1000;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--pink);color:#fff}
.btn.green{background:var(--teal)}
.btn.yellow{background:var(--yellow)}
.btn.purple{background:var(--purple);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:3px solid var(--ink);border-radius:14px;padding:13px;background:#fff}
.stat b{display:block;font-size:28px}
.note{font-size:12px;line-height:1.5;color:#5d584f;font-weight:700}
input[type=text],input[type=number]{width:100%;border:3px solid var(--ink);border-radius:12px;padding:13px;background:#fff;font-weight:900;outline:none}
input:focus{box-shadow:0 0 0 4px #28bca833}
.status{border:3px solid var(--ink);border-radius:12px;padding:14px;margin-top:10px;font-weight:1000}
.ok{background:#c9f6ec}.bad{background:#ffd8e2}.warn{background:#ffeab5}
.tablewrap{overflow:auto;max-height:55vh;border:2px solid var(--ink);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left}
th{background:var(--ink);color:#fff;position:sticky;top:0}
.projector{min-height:100vh;display:flex;flex-direction:column}
.projector .screen{flex:1;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.projector .bigquestion{min-height:auto;font-size:clamp(38px,6.5vw,96px);padding:25px}
.projector .counter{font-size:18px;font-weight:1000;text-align:center;padding:12px}
.scannerbox{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
video{width:100%;max-height:420px;background:#111;border:3px solid var(--ink);border-radius:15px;object-fit:cover}
.sheetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.sheetcell{aspect-ratio:1;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;background:#fff;border-radius:5px}
.sheetcell.free{background:var(--ink);color:var(--yellow)}
.sheetcell.marked{background:var(--teal)}
.footer{margin-top:18px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.catpill{display:inline-block;font-size:9px;font-weight:1000;padding:2px 7px;border-radius:999px;background:var(--pink);color:#fff}
@media(max-width:900px){.grid2,.scannerbox{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.app{padding:10px}.card{padding:14px}.topbar{align-items:flex-start}.pagebadge{font-size:11px}.statgrid{grid-template-columns:1fr}.bigquestion{min-height:200px}}

.timerBadge{display:inline-flex;align-items:center;gap:12px;border:4px solid var(--ink);border-radius:18px;background:var(--yellow);padding:9px 16px;box-shadow:4px 4px 0 var(--ink);font-weight:1000}
.timerLabel{font-size:11px;letter-spacing:1.5px}
.timerValue{font-size:clamp(28px,4vw,48px);font-variant-numeric:tabular-nums;line-height:1}
.timerBadge.urgent{background:var(--pink);color:#fff}
.projector .timerBadge{margin-top:8px;transform:scale(1.05)}
@media(max-width:540px){.timerBadge{padding:8px 12px}.timerValue{font-size:30px}}
</style>
</head>

setInterval(refreshTimer, 250);

function emit(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  try{
    if ("BroadcastChannel" in window){
      window.__mbbc = window.__mbbc || new BroadcastChannel(STORE);
      window.__mbbc.postMessage(state);
    }
  }catch(e){}
  render();
}
window.addEventListener("storage", e=>{
  if (e.key===STORE && e.newValue){ try{ state = JSON.parse(e.newValue); render(); }catch(x){} }
});
try{
  if ("BroadcastChannel" in window){
    window.__mbbc = new BroadcastChannel(STORE);
    window.__mbbc.onmessage = e=>{ if (e.data){ state = e.data; render(); } };
  }
}catch(e){}

function esc(v){ return String(v).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function route(){ return location.hash.replace("#","").split("?")[0].toLowerCase() || "home"; }
function openPage(name){ const base = window.location.href.split("#")[0]; window.open(base+"#"+name, "_blank", "noopener,noreferrer"); }

function nav(){
  const r = route();
  const links = [["home","HOST + MASTER KEY"],["display","PROJECTOR"],["key","AUDITOR"],["ledger","MASTER LEDGER"]];
  return `<nav class="nav">${links.map(([h,t])=>`<a class="${r===h?"active":""}" href="${esc(window.location.href.split("#")[0]+"#"+h)}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</nav>`;
}
function header(name){
  return `<header class="topbar"><div class="brand"><div><div class="logo">MATHBLITZ</div><div class="tag">MATHZILLA 2026 • MATHS CLUB EVENT CONTROL</div></div></div><div class="pagebadge">${esc(name)}</div></header>`;
}
function catBadge(cat){
  const c = CAT_COLORS[cat] || "#ed3b7a";
  return `<span class="catpill" style="background:${c}">${esc(cat)}</span>`;
}

// ---------- HOME / HOST CONTROL ----------

// ---------- MASTER KEY / CARD LOOKUP ----------
function masterKeyCard(){
  return `<div class="card" id="masterKeyCard">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h2 style="margin:0">MASTER KEY — 25 QUESTIONS</h2>
      <div class="note">Organizer-only answer key. Search by question, category, serial/target number, or keyword.</div></div>
      <div class="pill">25 / 25 TARGETS</div>
    </div>
    <input id="masterSearch" type="text" placeholder="Search question, category, or target number…" oninput="renderMasterKey()" style="margin-top:12px">
    <div id="masterRows" style="margin-top:12px"></div>
  </div>`;
}
function renderMasterKey(){
  const el=document.getElementById("masterRows");
  const input=document.getElementById("masterSearch");
  if(!el || !input) return;
  const term=input.value.trim().toLowerCase();
  const rows=QUESTIONS.map((q,i)=>({seq:i+1,...q})).filter(x=>{
    if(!term) return true;
    return String(x.seq).includes(term)||String(x.a).includes(term)||
      x.q.toLowerCase().includes(term)||x.cat.toLowerCase().includes(term);
  });
  el.innerHTML=`<div class="tablewrap"><table style="min-width:760px"><thead><tr>
    <th>SEQ</th><th>QUESTION</th><th>CATEGORY</th><th>TARGET</th><th>CALLED?</th>
  </tr></thead><tbody>${rows.map(x=>{
    const called=state.history.some(h=>h.a===x.a);
    return `<tr><td><b>${x.seq}</b></td><td>${esc(x.q)}</td><td>${catBadge(x.cat)}</td>
      <td><b style="font-size:18px">${x.a}</b></td>
      <td>${called?'<span class="status ok" style="display:inline-block;padding:5px 8px;margin:0">CALLED</span>':'<span class="status" style="display:inline-block;padding:5px 8px;margin:0">NOT CALLED</span>'}</td></tr>`;
  }).join("") || '<tr><td colspan="5" style="text-align:center;padding:25px">No matching questions.</td></tr>'}</tbody></table></div>`;
}
function calledNumbersForPosition(callNo){
  const n=Math.max(0,Math.min(QUESTIONS.length,Number(callNo)||0));
  return new Set(CALL_ORDER.slice(0,n).map(i=>QUESTIONS[i].a));
}
function cardLookupCard(){
  return `<div class="card">
    <h2 style="margin:0">CARD LOOKUP</h2>
    <div class="note">Enter the participant's serial number to reproduce the exact 5×5 card used for verification.</div>
    <input id="cardId" type="number" min="1" max="150" inputmode="numeric" placeholder="Serial number 1–150" oninput="renderCardLookup()" style="margin-top:12px">
    <div id="cardLookupOut"></div>
  </div>`;
}
function renderCardLookup(){
  const el=document.getElementById("cardLookupOut");
  const inp=document.getElementById("cardId");
  if(!el || !inp) return;
  const n=Number(inp.value);
  if(!n){el.innerHTML="";return;}
  const id=String(Math.max(1,Math.min(150,Math.floor(n)))).padStart(3,"0");
  const s=SHEETS.find(x=>x.id===id);
  if(!s){el.innerHTML='<div class="status bad">CARD NOT FOUND</div>';return;}
  el.innerHTML=`<div class="status ok" style="margin-top:12px">SERIAL ${s.id} — CARD FOUND</div>
    <div class="sheetgrid" style="margin-top:12px">${s.numbers.map(n=>`<div class="sheetcell">${n}</div>`).join("")}</div>`;
}
function auditorCallControl(){
  const stored=Number(localStorage.getItem("MATHBLITZ_AUDITOR_CALL")||0);
  return `<div class="card"><h2 style="margin:0">CURRENT OFFICIAL CALL</h2>
    <p class="note">For volunteers on separate devices: enter the call number announced by the Host. This avoids falsely claiming that LocalStorage synchronizes across devices.</p>
    <div class="row" style="align-items:stretch;margin-top:10px">
      <input id="auditorCall" type="number" min="0" max="25" value="${stored}" inputmode="numeric" placeholder="Call number 0–25" oninput="setAuditorCall()" style="flex:1;min-width:180px">
      <button class="btn green" onclick="syncAuditorToHost()">Use this device's host state</button>
    </div>
    <div id="calledGrid" class="sheetgrid" style="grid-template-columns:repeat(5,1fr);margin-top:12px"></div>
  </div>`;
}
function setAuditorCall(){
  const input=document.getElementById("auditorCall");
  if(!input)return;
  const n=Math.max(0,Math.min(25,Math.floor(Number(input.value)||0)));
  localStorage.setItem("MATHBLITZ_AUDITOR_CALL",String(n));
  renderCalledGrid(n);
  audit();
}
function syncAuditorToHost(){
  const n=state.history.length;
  localStorage.setItem("MATHBLITZ_AUDITOR_CALL",String(n));
  const input=document.getElementById("auditorCall");
  if(input) input.value=n;
  renderCalledGrid(n);
  audit();
}
function renderCalledGrid(callNo){
  const el=document.getElementById("calledGrid"); if(!el)return;
  const called=calledNumbersForPosition(callNo);
  el.innerHTML=Array.from({length:25},(_,i)=>{
    const n=i+1, ok=called.has(n);
    return `<div class="sheetcell ${ok?'marked':''}" style="aspect-ratio:auto;min-height:48px">${n}<small style="display:block;font-size:9px;margin-left:3px">${ok?'CALLED':'WAIT'}</small></div>`;
  }).join("");
}

function home(){
  const n = state.history.length;
  const q = n ? state.history[n-1] : null;
  const total = QUESTIONS.length;
  return `<main class="app"><div class="shell">${header("HOST CONTROL")}${nav()}
  <div class="card" style="border-color:#7a4a0c;background:#F6C44533"><span class="note">🔒 This screen is for you only. Open PROJECTOR on a second window/tab on THIS laptop and drag it to the screen — participants should never see this Control page.</span></div>
  <div class="grid2">
   <section>
    <div class="card">
     <div class="kicker">${q?`LAST CALLED • CLUE ${n} / ${total}`:"READY TO START"}</div>
     <div class="bigquestion">${q?esc(q.q):"MATHBLITZ<br><span style='color:var(--pink)'>— READY —</span>"}</div>
     <div class="note" style="text-align:center;margin-bottom:8px">Optimized official call order • anti-draw priority • 25 clues total • target numbers only</div><div class="callmeta">${q?`<span class="pill">TARGET ${q.a} • PRIVATE</span>${catBadge(q.cat)}`:"<span class='pill'>FIXED ORDER — SAME ON EVERY DEVICE</span>"}</div>
     <button class="btn primary full" style="margin-top:15px;font-size:18px" onclick="nextClue()" ${n>=total?"disabled":""}>${q?"CALL NEXT CLUE":"CALL FIRST CLUE"}</button>
     <button class="btn yellow full" style="margin-top:9px" onclick="resetRound()">RESET ROUND</button>
    </div>
    <div class="card">
     <div style="display:flex;justify-content:center;margin-bottom:12px">${timerBadge()}</div><div class="statgrid">
      <div class="stat"><span class="kicker">CALLED</span><b>${n}</b><span class="note">of ${total}</span></div>
      <div class="stat"><span class="kicker">REMAINING</span><b>${total-n}</b><span class="note">clues</span></div>
      <div class="stat"><span class="kicker">NEXT TARGET</span><b>${n<total?QUESTIONS[n].a:"—"}</b><span class="note">private</span></div>
     </div>
    </div>
   </section>
   <aside>
    <div class="card"><h2 style="margin-top:0">WEBSITE STATUS</h2><p class="note">The 25-clue call order is fixed and optimized against the 150 approved Bingo cards to reduce early simultaneous winners. Host and Auditor can independently verify the official sequence. <b>Same-device tabs</b> sync through LocalStorage/BroadcastChannel. A static GitHub Pages file cannot provide true cross-device LocalStorage sync by itself; for a phone-to-projector-laptop live controller, a realtime backend would be required.</p>
     <div class="status ok">✓ WEBSITE ONLINE<br>✓ 25 QUESTIONS • ANSWERS 1–25<br>✓ RANDOMIZED CALL ORDER • NO REPEATS</div>
    </div>
    <div class="card"><h2 style="margin-top:0">QUICK ACCESS</h2><div class="row">
     <button class="btn green" onclick="openPage('display')">Projector</button><button class="btn yellow" onclick="openPage('key')">Auditor</button>
    </div></div>
   </aside>
  </div>
  <div style="margin-top:18px">${masterKeyCard()}</div><div class="card" style="margin-top:18px">
<h3 style="margin-top:0">OFFICIAL CALL ORDER</h3>
<p class="note">Target numbers only — use this order for the live round. Physical Bingo sheets are unchanged.</p>
<div class="pill" style="font-size:15px;line-height:1.8;white-space:normal">22 → 1 → 12 → 19 → 7 → 18 → 14 → 4 → 9 → 21 → 8 → 3 → 10 → 25 → 23 → 2 → 24 → 16 → 17 → 13 → 6 → 20 → 11 → 15 → 5</div>
</div>
  </div></main>`;
}
function nextClue(){
  const total = QUESTIONS.length;
  if (state.history.length >= total){ alert("All "+total+" clues have already been called."); return; }
  const q = QUESTIONS[CALL_ORDER[state.history.length]];
  startTimerIfNeeded();
  state = {...state, started:true, history:[...state.history, {seq: state.history.length+1, q:q.q, cat:q.cat, a:q.a}]};
  emit();
}
function resetRound(){
  if (confirm("Reset the entire MathBlitz round? This clears the call ledger on this browser/device.")){ state = blank(); emit(); }
}

// ---------- PROJECTOR (public display, no answers) ----------
function display(){
  const n = state.history.length;
  const q = n ? state.history[n-1] : null;
  const total = QUESTIONS.length;
  return `<main class="app projector"><div class="shell" style="width:100%;max-width:1500px;min-height:100vh;display:flex;flex-direction:column">${header("PROJECTOR DISPLAY")}${nav()}
  <div class="card screen">
  <div class="kicker" style="font-size:16px">${q?`CLUE ${n} / ${total}`:"MATHBLITZ"}</div>
  ${timerBadge()}
  <div class="bigquestion">${q?esc(q.q):"<span style='color:var(--pink)'>READY</span>"}</div>
  <div class="counter">${n} / ${total} CLUES CALLED • 20-MINUTE ROUND</div>
</div></div></main>`;
}

// ---------- AUDITOR (answer verification, works on any device) ----------
function ledgerRows(limit){
  const items = limit ? state.history.slice(-limit).reverse() : state.history.slice().reverse();
  return items.map(h=>`<tr><td><b>${h.seq}</b></td><td><b>${esc(h.q)}</b></td><td>${catBadge(h.cat)}</td><td><b>${h.a}</b></td></tr>`).join("");
}
function ledgerCard(){
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">MASTER CALLER LEDGER</h2><div class="note">Exact call order • audit record</div></div><div class="pill">${state.history.length}/${QUESTIONS.length} CALLED</div></div><div style="margin-top:12px" class="tablewrap"><table><thead><tr><th>SEQ</th><th>CLUE</th><th>CATEGORY</th><th>ANSWER</th></tr></thead><tbody>${ledgerRows()||'<tr><td colspan="4" class="empty" style="text-align:center;padding:30px">No clues called yet.</td></tr>'}</tbody></table></div></div>`;
}
function key(){
  return `<main class="app"><div class="shell">${header("AUDITOR / VERIFIER")}${nav()}
  ${auditorCallControl()}
  <div class="card"><h1 style="margin-top:0">Instant Winner Verification</h1>
    <p class="note">Enter any claimed number from 1–25. The result is based on the official call position selected above.</p>
    <input id="audit" type="number" min="1" max="25" inputmode="numeric" placeholder="Claimed Bingo number (1–25)" oninput="audit()">
    <div id="auditOut"></div>
  </div>
  ${cardLookupCard()}
  <div style="margin-top:18px">${ledgerCard()}</div>
  </div></main>`;
}
function audit(){
  const x=document.getElementById("audit"), o=document.getElementById("auditOut");
  if(!x||!o)return;
  if(!x.value){o.innerHTML="";return;}
  const n=Number(x.value);
  const callNo=Math.max(0,Math.min(25,Math.floor(Number(localStorage.getItem("MATHBLITZ_AUDITOR_CALL")||0))));
  if(!Number.isInteger(n)||n<1||n>25){
    o.innerHTML='<div class="status warn">INVALID — ENTER A NUMBER FROM 1 TO 25</div>';return;
  }
  const called=calledNumbersForPosition(callNo);
  const seq=CALL_ORDER.indexOf(n)+1;
  o.innerHTML=called.has(n)
    ? `<div class="status ok">✓ VALID — NUMBER ${n} WAS OFFICIALLY CALLED (CALL ${seq})</div>`
    : `<div class="status bad">✕ INVALID — NUMBER ${n} HAS NOT BEEN CALLED YET</div>`;
}

// ---------- PRINT PACK ----------
// The physical Bingo PDF is intentionally not linked from the website.
// It is distributed/printed separately by organizers.

function sheets(){
  return `<main class="app"><div class="shell">${header("BINGO CARD REFERENCE")}${nav()}
  <div class="card"><h1 style="margin-top:0">Physical Bingo Sheets</h1>
    <p class="note">The approved physical Bingo PDF is handled separately and is not opened from this website. Volunteers can use CARD LOOKUP on the Auditor page when a serial number is claimed.</p>
    <button class="btn yellow" onclick="location.hash='key'">OPEN CARD LOOKUP</button>
  </div></div></main>`;
}
// ---------- LEDGER ----------
function ledger(){
  return `<main class="app"><div class="shell">${header("MASTER LEDGER")}${nav()}${ledgerCard()}<div class="footer">MathBlitz official audit record.</div></div></main>`;
}

function homeRoute(){
  const r = route();
  if (r==="display") return display();
  if (r==="key") return key();
  if (r==="sheets") return sheets();
  if (r==="ledger") return ledger();
  return home();
}
function render(){
  document.getElementById("app").innerHTML = homeRoute();
  if (route()==="key"){ setTimeout(()=>{ syncAuditorToHost(); audit(); renderCardLookup(); }, 0); }
  if (route()==="home") setTimeout(renderMasterKey, 0);
}
window.addEventListener("hashchange", ()=>{ render(); });
render();
</script>
</body>
</html>
